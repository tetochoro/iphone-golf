<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>iPhone→iPad 映像伝送 試作</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1e1e1e; color: #fff; font-family: -apple-system, "Hiragino Sans", sans-serif;
  }
  #app { padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .card {
    background: #2a2a2a; border-radius: 12px; padding: 14px; margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; color: #00e5ff; margin: 0 0 8px; }
  button {
    font-size: 15px; padding: 10px 16px; border: none; border-radius: 10px;
    background: #424242; color: #fff; margin: 4px 4px 4px 0;
  }
  button.primary { background: #2e7d32; font-weight: 700; }
  button:active { filter: brightness(1.3); }
  textarea {
    width: 100%; height: 90px; font-size: 11px; font-family: monospace;
    background: #111; color: #0f0; border: 1px solid #444; border-radius: 8px;
    padding: 8px; resize: vertical;
  }
  video {
    width: 100%; max-height: 50vh; background: #000; border-radius: 10px;
  }
  #status { font-size: 13px; color: #ffcc00; margin: 8px 0; }
  .hidden { display: none; }
  .roleBtn {
    width: 100%; padding: 22px; font-size: 18px; margin: 8px 0;
    border-radius: 14px;
  }
</style>
</head>
<body>
<div id="app">
  <h1>📡 iPhone → iPad 映像伝送 試作</h1>

  <!-- 役割選択 -->
  <div id="roleSelect">
    <div class="card">
      <p>この端末の役割を選んでください。</p>
      <button class="roleBtn primary" onclick="startSender()">📱 送信側として使う(iPhone)</button>
      <button class="roleBtn" style="background:#0288d1;" onclick="startReceiver()">📺 受信側として使う(iPad)</button>
    </div>
    <div class="card">
      <h2>事前準備</h2>
      <p style="font-size:13px; line-height:1.6;">
        1. iPhoneの「設定」→「インターネット共有」をON<br>
        2. iPadをそのiPhoneのWi-Fiに接続<br>
        3. 両方の端末でこのページを開く(インターネット接続は不要)
      </p>
    </div>
  </div>

  <!-- 送信側(iPhone)UI -->
  <div id="senderUI" class="hidden">
    <div id="status">準備中...</div>
    <div class="card">
      <h2>① あなたの映像(送信中)</h2>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="card">
      <h2>② このコードをiPadに送ってください(コピー)</h2>
      <textarea id="offerCode" readonly placeholder="接続コードがここに表示されます..."></textarea>
      <button onclick="copyText('offerCode')">📋 コピー</button>
    </div>
    <div class="card">
      <h2>③ iPad側で出た「応答コード」をここに貼り付け</h2>
      <textarea id="answerInput" placeholder="ここにiPadで表示されたコードを貼り付けてください"></textarea>
      <button class="primary" onclick="applyAnswer()">🔗 接続する</button>
    </div>
  </div>

  <!-- 受信側(iPad)UI -->
  <div id="receiverUI" class="hidden">
    <div id="statusR">準備中...</div>
    <div class="card">
      <h2>① iPhone側で出た「接続コード」をここに貼り付け</h2>
      <textarea id="offerInput" placeholder="ここにiPhoneで表示されたコードを貼り付けてください"></textarea>
      <button class="primary" onclick="createAnswer()">✅ 応答コードを作成</button>
    </div>
    <div class="card">
      <h2>② このコードをiPhoneに送ってください(コピー)</h2>
      <textarea id="answerCode" readonly placeholder="応答コードがここに表示されます..."></textarea>
      <button onclick="copyText('answerCode')">📋 コピー</button>
    </div>
    <div class="card">
      <h2>③ 受信した映像</h2>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>
</div>

<script>
"use strict";

// STUN/TURNサーバーは使わない(同じホットスポット内=同一ネットワークなので不要。
// インターネット接続なしでも直接繋がる)
const pcConfig = { iceServers: [] };
let pc = null;

// ---------------------------------------------------
// 共通ユーティリティ
// ---------------------------------------------------
function waitForIceGatheringComplete(peerConn) {
  if (peerConn.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    function check() {
      if (peerConn.iceGatheringState === "complete") {
        peerConn.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    }
    peerConn.addEventListener("icegatheringstatechange", check);
  });
}

function encodeDescription(desc) {
  return btoa(encodeURIComponent(JSON.stringify(desc)));
}
function decodeDescription(code) {
  return JSON.parse(decodeURIComponent(atob(code.trim())));
}

function copyText(id) {
  const el = document.getElementById(id);
  el.select();
  el.setSelectionRange(0, 999999);
  document.execCommand("copy");
  alert("コピーしました");
}

function showRole(role) {
  document.getElementById("roleSelect").classList.add("hidden");
  document.getElementById("senderUI").classList.toggle("hidden", role !== "sender");
  document.getElementById("receiverUI").classList.toggle("hidden", role !== "receiver");
}

// ---------------------------------------------------
// 送信側(iPhone)
// ---------------------------------------------------
async function startSender() {
  showRole("sender");
  const statusEl = document.getElementById("status");
  statusEl.textContent = "カメラを起動しています...";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    document.getElementById("localVideo").srcObject = stream;

    pc = new RTCPeerConnection(pcConfig);
    stream.getTracks().forEach((track) => pc.addTrack(track, stream));

    pc.onconnectionstatechange = () => {
      statusEl.textContent = `接続状態: ${pc.connectionState}`;
      if (pc.connectionState === "connected") {
        statusEl.textContent = "✅ 接続済み・送信中";
        statusEl.style.color = "#00ff00";
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    statusEl.textContent = "接続コードを生成中...";
    await waitForIceGatheringComplete(pc);

    document.getElementById("offerCode").value = encodeDescription(pc.localDescription);
    statusEl.textContent = "上のコードをコピーして、iPadに送ってください";
  } catch (err) {
    statusEl.textContent = "エラー: " + err.message;
  }
}

async function applyAnswer() {
  const statusEl = document.getElementById("status");
  const code = document.getElementById("answerInput").value;
  if (!code.trim()) { alert("応答コードを貼り付けてください"); return; }
  try {
    const answer = decodeDescription(code);
    await pc.setRemoteDescription(answer);
    statusEl.textContent = "接続処理中...";
  } catch (err) {
    statusEl.textContent = "エラー: " + err.message;
  }
}

// ---------------------------------------------------
// 受信側(iPad)
// ---------------------------------------------------
function startReceiver() {
  showRole("receiver");
  const statusEl = document.getElementById("statusR");
  statusEl.textContent = "iPhone側のコードを貼り付けて「応答コードを作成」を押してください";

  pc = new RTCPeerConnection(pcConfig);

  pc.ontrack = (event) => {
    document.getElementById("remoteVideo").srcObject = event.streams[0];
  };

  pc.onconnectionstatechange = () => {
    statusEl.textContent = `接続状態: ${pc.connectionState}`;
    if (pc.connectionState === "connected") {
      statusEl.textContent = "✅ 接続済み・受信中";
      statusEl.style.color = "#00ff00";
    }
  };
}

async function createAnswer() {
  const statusEl = document.getElementById("statusR");
  const code = document.getElementById("offerInput").value;
  if (!code.trim()) { alert("iPhone側のコードを貼り付けてください"); return; }

  try {
    const offer = decodeDescription(code);
    await pc.setRemoteDescription(offer);

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    statusEl.textContent = "応答コードを生成中...";
    await waitForIceGatheringComplete(pc);

    document.getElementById("answerCode").value = encodeDescription(pc.localDescription);
    statusEl.textContent = "上のコードをコピーして、iPhoneに送ってください";
  } catch (err) {
    statusEl.textContent = "エラー: " + err.message;
  }
}
</script>
</body>
</html>
